<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>yaah</title>
<link rel="stylesheet" href="pico.min.css">
<script src="marked.min.js"></script>
<script defer src="alpine.min.js"></script>
<style>
[x-cloak]{display:none!important}
body{height:100dvh;display:flex;flex-direction:column;font-size:.925rem}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.4rem}
.msg{max-width:80%;padding:.6rem 1rem;border-radius:12px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;font-size:.875rem}
.user{align-self:flex-end;background:var(--pico-muted-border-color);color:var(--pico-color);border-bottom-right-radius:4px}
.asst{align-self:flex-start;background:var(--pico-card-background-color);border-bottom-left-radius:4px}
.err{align-self:flex-start;background:#dc2626;color:#fff;max-height:120px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word}
.msg :where(h1,h2,h3,h4,h5,h6){font-size:1em;margin:.4rem 0 .15rem;color:inherit}
.msg :where(p){margin:.15rem 0}
.msg :where(ul,ol){padding-left:1.5rem;margin:.15rem 0}
.msg :where(li){margin:0}
.msg :where(pre){margin:.3rem 0;padding:.5rem;font-size:.8em}
.msg :where(code){font-size:.85em;padding:0;background:0}
.msg :where(blockquote){margin:.3rem 0;padding:.2rem .8rem;border-left:3px solid var(--pico-muted-border-color)}
.msg :where(table){font-size:.85em;margin:.3rem 0}
.msg :where(th,td){padding:.15rem .4rem}
.msg :where(hr){margin:.4rem 0}
.msg :where(img){max-width:100%}

/* tool messages — inline collapsible, matching TUI style */

/* header bar */
#head{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;background:var(--pico-card-background-color);border-bottom:1px solid var(--pico-muted-border-color);font-size:.85rem;font-family:var(--pico-font-family-monospace,monospace)}
#head .brand{font-weight:700;color:var(--pico-primary)}
#head .meta{color:var(--pico-muted-color);flex:1}
#head .mcp-badge{background:var(--pico-primary);color:var(--pico-primary-inverse);padding:.15rem .5rem;border-radius:8px;font-size:.75rem;cursor:pointer}
.mcp-wrap{position:relative}
.mcp-drop{position:absolute;right:0;top:calc(100% + 6px);background:var(--pico-card-background-color);border:1px solid var(--pico-muted-border-color);border-radius:8px;padding:.5rem .75rem;min-width:220px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.mcp-item{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;font-size:.8rem}
.mcp-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mcp-dot.on{background:#22c55e}
.mcp-dot.off{background:#dc2626}
.mcp-name{font-weight:600;color:var(--pico-color)}
.mcp-detail{color:var(--pico-muted-color);margin-left:auto;font-size:.75rem}
.mcp-err{color:#f87171;font-size:.7rem;width:100%}

/* command palette */
.pal-wrap{position:relative}
.pal-btn{font-family:inherit;font-size:.75rem;line-height:1.2;margin:0;width:auto;padding:.2rem .55rem;border:1px solid var(--pico-muted-border-color);border-radius:6px;background:transparent;color:var(--pico-muted-color);cursor:pointer;box-shadow:none;transition:border-color .15s,color .15s,background-color .15s}
.pal-btn:hover,.pal-btn:focus-visible{border-color:var(--pico-primary);color:var(--pico-primary);background:color-mix(in srgb,var(--pico-primary) 10%,transparent);box-shadow:none}
.pal-drop{position:absolute;right:0;top:calc(100% + 6px);width:340px;background:var(--pico-card-background-color);border:1px solid var(--pico-muted-border-color);border-radius:10px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden;animation:pal-in .13s ease-out}
@keyframes pal-in{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.pal-input-wrap{display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;border-bottom:1px solid var(--pico-muted-border-color)}
.pal-prompt{color:var(--pico-primary);font-weight:700}
.pal-input-wrap input{flex:1;margin:0;padding:0;border:0;background:transparent;box-shadow:none;color:var(--pico-color);font-size:.85rem;font-family:inherit}
.pal-input-wrap input:focus,.pal-input-wrap input:focus-visible{outline:none;border:0;box-shadow:none;background:transparent}
.pal-list{max-height:320px;overflow-y:auto;padding:.35rem}
.pal-group{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--pico-muted-color);padding:.45rem .6rem .2rem}
.pal-item{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border-radius:6px;cursor:pointer;font-size:.83rem}
.pal-item.active,.pal-item:hover{background:color-mix(in srgb,var(--pico-primary) 16%,transparent)}
.pal-icon{flex-shrink:0;width:1.1em;text-align:center;color:var(--pico-muted-color);font-size:.85em}
.pal-item.current .pal-icon{color:var(--pico-primary)}
.pal-label{color:var(--pico-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item.current .pal-label{color:var(--pico-primary)}
.pal-hint{margin-left:auto;color:var(--pico-muted-color);font-size:.72rem;flex-shrink:0}
.pal-item.disabled{opacity:.4;cursor:default}
.pal-item.disabled:hover{background:transparent}
.pal-empty{padding:.8rem .6rem;color:var(--pico-muted-color);font-size:.8rem;text-align:center}
.pal-foot{display:flex;gap:.9rem;align-items:center;padding:.4rem .75rem;border-top:1px solid var(--pico-muted-border-color);color:var(--pico-muted-color);font-size:.7rem}
.pal-kbd{border:1px solid var(--pico-muted-border-color);border-bottom-width:2px;border-radius:4px;padding:0 .3rem;font-size:.68rem;font-family:inherit;margin-right:.15rem}

/* todo panel */
#todos-wrap{border-bottom:1px solid var(--pico-muted-border-color);font-size:.8rem;font-family:var(--pico-font-family-monospace,monospace)}
#todos-wrap .todos-head{display:flex;align-items:center;gap:.5rem;padding:.35rem 1rem;cursor:pointer;user-select:none;color:var(--pico-muted-color)}
#todos-wrap .todos-head:hover{background:var(--pico-card-background-color)}
#todos-wrap .todos-head .arrow{display:inline-block;transition:transform .2s}
#todos-wrap .todos-head .arrow.open{transform:rotate(90deg)}
#todos-body{padding:.3rem 1rem .5rem;display:flex;flex-direction:column;gap:.15rem}
.todo-item{display:flex;align-items:baseline;gap:.35rem;padding:.15rem 0}
.todo-status{flex-shrink:0;font-size:.9em;width:1.2em;text-align:center}
.todo-prio{flex-shrink:0;font-size:.7em;padding:0 .25rem;border-radius:3px;text-transform:uppercase}
.todo-prio.high{background:rgba(220,38,38,.2);color:#f87171}
.todo-prio.medium{background:rgba(250,204,21,.2);color:#facc15}
.todo-prio.low{background:rgba(156,163,175,.2);color:#9ca3af}
.todo-content{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-time{flex-shrink:0;font-size:.75em;color:var(--pico-muted-color)}
.tool{align-self:flex-start;max-width:90%;font-size:.8rem;margin:.15rem 0;cursor:pointer;user-select:none}
.tool-head{display:flex;align-items:baseline;gap:.35rem;padding:.25rem 0;color:var(--pico-muted-color);font-family:var(--pico-font-family-monospace,monospace)}
.tool-icon{flex-shrink:0;font-size:.85em}
.tool-name{font-weight:600;color:var(--pico-color)}
.tool-summary{color:var(--pico-muted-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-head .tool-summary::before{content:'—';margin-right:.35rem;color:var(--pico-muted-border-color)}
.tool-model{flex-shrink:0;font-size:.72em;color:var(--pico-muted-color);border:1px solid var(--pico-muted-border-color);border-radius:4px;padding:.05rem .35rem;white-space:nowrap}
.tool-dur{flex-shrink:0;font-size:.75em;color:var(--pico-muted-color);margin-left:auto}
.tool-err{color:#dc2626;font-weight:600}
.tool-body{margin-top:.2rem}
.tool-result{border:1px solid var(--pico-muted-border-color);border-radius:6px;padding:.5rem .65rem;font-size:.78rem;font-family:var(--pico-font-family-monospace,monospace);white-space:pre-wrap;word-wrap:break-word;max-height:280px;overflow-y:auto;background:var(--pico-card-background-color);line-height:1.35}

/* running tool pulse */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.tool-running .tool-icon{animation:pulse 1.2s ease-in-out infinite}

/* thinking bounce */
.think{align-self:flex-start;padding:.6rem 1rem;border-radius:12px;border-bottom-left-radius:4px;font-size:.85rem;max-width:80%;background:var(--pico-card-background-color);color:var(--pico-muted-color)}
.think .bounce span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--pico-muted-color);animation:bounce .6s ease-in-out infinite}
.think .bounce span:nth-child(2){animation-delay:.15s}
.think .bounce span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.reason{margin-top:.4rem;font-size:.8rem;max-height:120px;overflow-y:auto;white-space:pre-wrap;font-style:italic;color:var(--pico-muted-color)}

#bar{display:flex;gap:.5rem;padding:.75rem 1rem;border-top:1px solid var(--pico-muted-border-color);align-items:stretch}
#prompt{flex:1;resize:none;min-height:44px;max-height:160px}
#bar button{align-self:stretch;margin:0}
#foot{display:flex;justify-content:space-between;align-items:center;padding:.25rem 1rem;font-size:.75rem;border-top:1px solid var(--pico-muted-border-color);color:var(--pico-muted-color)}
.led{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:#555;transition:background .2s}
.led.on{background:#22c55e}
.led.off{background:#555}
.led.active{background:#facc15;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
dialog article{max-width:480px;min-width:320px}
</style>
</head>
<body x-data="yaah" x-cloak>

  <!-- header bar -->
  <div id="head">
    <span class="brand">yaah</span>
    <span class="meta" x-text="head.provider ? head.provider + ' / ' + head.model : ''"></span>
    <div class="pal-wrap" @keydown.window="palKey($event)">
      <button class="pal-btn" @click="palToggle()" :title="'Command palette (' + palKeyLabel + ')'" x-text="palKeyLabel"></button>
      <div class="pal-drop" x-show="palOpen" @click.outside="palClose()">
        <div class="pal-input-wrap">
          <span class="pal-prompt">›</span>
          <input x-ref="palInput" x-model="palQuery" @input="palIdx = palFirstEnabled()"
            placeholder="Type a command…" autocomplete="off" spellcheck="false">
        </div>
        <div class="pal-list" x-ref="palList">
          <template x-for="(it, i) in palItems()" :key="it.id">
            <div>
              <div class="pal-group" x-show="it.first" x-text="palGroupLabel(it.group)"></div>
              <div class="pal-item"
                :class="{'active': i === palIdx, 'disabled': it.disabled, 'current': it.current}"
                @click="palRun(i)" @mouseenter="!it.disabled && (palIdx = i)">
                <span class="pal-icon" x-text="it.current ? '✓' : it.icon"></span>
                <span class="pal-label" x-text="it.label"></span>
                <span class="pal-hint" x-text="it.hint"></span>
              </div>
            </div>
          </template>
          <div class="pal-empty" x-show="!palItems().length" x-text="'no matches for “' + palQuery + '”'"></div>
        </div>
        <div class="pal-foot">
          <span><span class="pal-kbd">↑</span><span class="pal-kbd">↓</span> navigate</span>
          <span><span class="pal-kbd">↵</span> run</span>
          <span><span class="pal-kbd">esc</span> close</span>
        </div>
      </div>
    </div>
    <div class="mcp-wrap" x-show="head.mcpServers && head.mcpServers.length">
      <span class="mcp-badge" @click="mcpOpen = !mcpOpen" x-text="head.mcpServers.length + ' MCP'"></span>
      <div class="mcp-drop" x-show="mcpOpen" @click.outside="mcpOpen = false">
        <template x-for="s in head.mcpServers" :key="s.name">
          <div class="mcp-item">
            <span class="mcp-dot" :class="s.connected ? 'on' : 'off'"></span>
            <span class="mcp-name" x-text="s.name"></span>
            <span class="mcp-detail" x-text="s.transport + ' · ' + s.toolCount + ' tools'"></span>
            <span class="mcp-err" x-show="s.error" x-text="s.error"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- todo panel -->
  <div id="todos-wrap" x-show="todos.length">
    <div class="todos-head" @click="todosOpen = !todosOpen">
      <span class="arrow" :class="todosOpen && 'open'">▶</span>
      <span x-text="todos.length + ' todo' + (todos.length !== 1 ? 's' : '')"></span>
    </div>
    <div id="todos-body" x-show="todosOpen">
      <template x-for="t in todos" :key="t.id">
        <div class="todo-item">
          <span class="todo-status" :style="statusStyle(t.status)" x-text="statusIcon(t.status)"></span>
          <span class="todo-prio" :class="t.priority" x-show="t.priority" x-text="t.priority"></span>
          <span class="todo-content" x-text="t.content"></span>
          <span class="todo-time" x-show="t.created_at" x-text="shortTime(t.created_at)"></span>
        </div>
      </template>
    </div>
  </div>

<div id="log" x-ref="log">
  <template x-for="m in msgs" :key="m.id">
    <div>
      <!-- assistant / user / error messages -->
      <div x-show="m.role !== 'tool'" :class="'msg ' + classOf(m.role)" x-html="m.html"></div>
      <!-- tool messages: inline collapsible -->
      <div x-show="m.role === 'tool'" class="tool" :class="m.running && 'tool-running'"
        @click="m.expanded = !m.expanded; scroll()">
        <div class="tool-head">
          <span class="tool-icon" x-text="m.running ? (m.name === 'spawn_subagent' ? '🤖' : '⏳') : m.error ? '✗' : '✓'"></span>
          <span class="tool-name" x-text="toolLabel(m)"></span>
          <span class="tool-summary" x-show="toolSummary(m)" x-text="toolSummary(m)"></span>
          <span class="tool-model" x-show="m.subModel" x-text="modelLabel(m.subModel)"></span>
          <span class="tool-dur" x-show="!m.running && m.duration" x-text="m.duration"></span>
          <span class="tool-err" x-show="m.error" x-text="m.error"></span>
        </div>
        <div class="tool-body" x-show="m.expanded && m.result">
          <pre class="tool-result" x-text="m.result"></pre>
        </div>
      </div>
    </div>
  </template>
  <div class="think" x-show="live && !stream && think">
    <span class="bounce"><span></span><span></span><span></span></span>
    <div class="reason" x-ref="reason" x-text="think" x-show="think"></div>
  </div>
  <div class="msg asst" x-show="stream" x-html="md(stream)"></div>
</div>

<div id="bar">
  <textarea id="prompt" rows="1" placeholder="Ask yaah…" x-ref="el"
    :disabled="live"
    @keydown.enter="!$event.shiftKey && ($event.preventDefault(), send())"
    @input="$refs.el.style.height='auto';$refs.el.style.height=Math.min($refs.el.scrollHeight,160)+'px'"
    autofocus></textarea>
  <button :disabled="live" @click="send()">Send</button>
  <button x-show="live" class="secondary" @click="stop()">Stop</button>
</div>

<div id="foot">
  <span><span class="led" :class="live ? 'active' : (on ? 'on' : 'off')"></span><span x-text="status"></span></span>
  <span x-text="ctx ? ctx + '% context' : ''"></span>
</div>

<dialog x-ref="dlg">
  <article>
    <header x-text="modal.title"></header>
    <template x-if="modal.type === 'question'">
      <div>
        <p x-text="modal.q"></p>
        <template x-for="(o, i) in modal.opts" :key="i">
          <label>
            <input :type="modal.multi ? 'checkbox' : 'radio'" name="qopt" :value="o.label">
            <span x-text="o.label"></span>
            <small x-show="o.description" x-text="' — ' + o.description"></small>
          </label>
        </template>
      </div>
    </template>
    <template x-if="modal.type === 'approval'">
      <div>
        <p><strong x-text="modal.name"></strong></p>
        <pre x-show="modal.args" x-text="modal.args"></pre>
      </div>
    </template>
    <footer>
      <template x-if="modal.type === 'question'">
        <button class="contrast" @click="ask()">Confirm</button>
      </template>
      <template x-if="modal.type === 'approval'">
        <div style="display:flex;gap:.5rem;justify-content:flex-end">
          <button @click="allow(false)">Deny</button>
          <button class="contrast" @click="allow(true)">Allow</button>
        </div>
      </template>
    </footer>
  </article>
</dialog>

<script>
marked.setOptions({breaks:true,gfm:true})

function esc(s) {
  const d = document.createElement('div')
  d.textContent = s
  return d.innerHTML
}

function fmtMs(ms) {
  if (ms < 1000) return ms + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's'
  const m = Math.floor(ms / 60000)
  const s = ((ms % 60000) / 1000).toFixed(0)
  return m + 'm ' + s + 's'
}

// toolLabel builds a display header for a tool from its name + args.
function toolLabel(m) {
  if (m.name === 'bash') return 'bash — ' + (m.args || '')
  if (m.name === 'spawn_subagent') {
    // summary already has "sub-agent: role · desc" — just show name
    return 'sub-agent'
  }
  if (m.name === 'webfetch' || m.name === 'http') return m.name
  return m.name
}

document.addEventListener('alpine:init', () => {
  Alpine.data('yaah', () => {
    let _n = 0
    return {
      msgs: [], stream: '', think: '',
      live: false, on: false,
      status: 'connecting…', ctx: null,
      head: {}, todos: [], todosOpen: true, mcpOpen: false,
      palOpen: false, palQuery: '', palIdx: 0, palKeyLabel: 'Ctrl+K',
      models: [], providerNames: {},
      modal: {type:'',title:'',q:'',opts:[],multi:false,name:'',args:'',aid:null},
      _es: null,
      // track running tool messages by tool_id for end-event update
      _tools: {},

      init() {
        this.palKeyLabel = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl+K'
        this.connect()
      },
      md(t) { return marked.parse(t) },
      classOf(r) { return r === 'user' ? 'user' : r === 'error' ? 'err' : 'asst' },
      add(role, text) { this.msgs.push({id: ++_n, role, raw: text, html: role === 'asst' ? marked.parse(text) : esc(text), expanded: false, running: false}) },
      addTool(id, name, args, summary) {
        const m = {id: ++_n, role: 'tool', name, args, summary, result: '', duration: '', error: '', running: true, expanded: false, subModel: ''}
        this.msgs.push(m)
        if (id != null) this._tools[id] = m
        return m
      },
      scroll() { this.$nextTick(() => { const l = this.$refs.log; if (l) l.scrollTop = l.scrollHeight }) },

      // toolLabel exposed for template
      toolLabel(m) { return toolLabel(m) },
      // toolSummary strips the "sub-agent" prefix the backend summary
      // carries, since the name column already identifies the row.
      toolSummary(m) {
        if (m.name === 'spawn_subagent' && m.summary) {
          if (m.summary.startsWith('sub-agent: ')) return m.summary.slice('sub-agent: '.length)
          if (m.summary.startsWith('sub-agent · ')) return m.summary.slice('sub-agent · '.length)
        }
        return m.summary
      },
      // modelLabel resolves a bare model name to "Provider / model" using
      // the catalog delivered via ctrl.models; falls back to the bare name.
      modelLabel(model) {
        for (const m of this.models) {
          const i = m.indexOf('/')
          if (i > 0 && m.slice(i + 1) === model) {
            const pk = m.slice(0, i)
            return (this.providerNames[pk] || pk) + ' / ' + model
          }
        }
        return model
      },
      // matchSubRow finds the running spawn_subagent tool row a
      // subagent.start/end event belongs to, by role + prompt. Truncated
      // args (unparseable JSON) fall back to the first available row.
      matchSubRow(role, prompt) {
        let fallback = null
        for (const id in this._tools) {
          const t = this._tools[id]
          if (t.name !== 'spawn_subagent' || t.subModel) continue
          try {
            const a = JSON.parse(t.args)
            if ((!role || a.role === role) && (!prompt || !a.prompt || a.prompt === prompt)) return t
          } catch (_) { if (!fallback) fallback = t }
        }
        return fallback
      },

      connect() {
        if (this._es) this._es.close()
        this._es = new EventSource('/api/stream')
        this._es.onopen = () => { this.on = true; this.status = 'ready' }
        this._es.onmessage = e => { try { this.onEvt(JSON.parse(e.data)) } catch (_) {} }
        this._es.onerror = () => { this.on = false; this.status = 'reconnecting…' }
      },

      onEvt(d) {
        switch (d.type) {
          case 'token':      this.stream += d.text; this.scroll(); break
          case 'thinking':   this.think += d.text; this.$nextTick(() => { const r = this.$refs.reason; if (r) r.scrollTop = r.scrollHeight }); this.scroll(); break
          case 'flush':
            this.stream = ''
            if (d.content) this.add('asst', d.content)
            this.scroll(); break
          case 'tool.start':
            this.addTool(d.tool_id, d.name, d.args, d.summary);
            this.scroll(); break
          case 'tool.end':
            var tm = d.tool_id != null ? this._tools[d.tool_id] : null
            if (tm) {
              tm.running = false
              tm.result = d.result || ''
              tm.duration = d.ms ? fmtMs(d.ms) : ''
              tm.error = d.error || ''
              tm.summary = d.summary || tm.summary
              if (d.error) tm.expanded = true
              delete this._tools[d.tool_id]
            }
            if (tm && d.error) { this.add('error', d.name + ': ' + d.error) }
            this.scroll(); break
          case 'subagent.start': {
            const row = this.matchSubRow(d.role, d.prompt)
            if (row && d.model) row.subModel = d.model
            this.status = 'sub-agent: ' + d.role + (d.model ? ' · ' + d.model : ''); break
          }
          case 'subagent.end': {
            const row = this.matchSubRow(d.role, d.prompt)
            if (row && d.model) row.subModel = d.model
            this.status = 'ready'; break
          }
          case 'done':
            if (this.stream) { this.add('asst', this.stream); this.stream = '' }
            for (const id in this._tools) {
              const t = this._tools[id]
              t.running = false
              if (!t.error) t.error = 'interrupted'
            }
            this._tools = {}
            this.live = false; this.think = ''
            if (d.error) this.add('error', d.error)
            if (d.context_tokens && d.context_window) this.ctx = Math.min(Math.round(d.context_tokens / d.context_window * 100), 100)
            this.status = 'ready'; this.scroll(); break
          case 'ctrl.status': this.status = d.text; break
          case 'ctrl.error':  this.add('error', d.error); this.scroll(); break
          case 'ctrl.question':
            this.modal = {type:'question', title:d.header||'Question', q:d.question, opts:d.options||[], multi:!!d.multi, name:'', args:'', aid:d.id}
            this.$nextTick(() => this.$refs.dlg.showModal()); break
          case 'ctrl.approval':
            this.modal = {type:'approval', title:'Tool Approval', q:'', opts:[], multi:false, name:d.name, args:d.args||'', aid:d.id}
            this.$nextTick(() => this.$refs.dlg.showModal()); break
          case 'ctrl.context':
            if (d.tokens && d.window) this.ctx = Math.min(Math.round(d.tokens / d.window * 100), 100); break
          case 'ctrl.todos':
            this.todos = (d.items || []).map(function(item, idx) {
              return {id: item.id || idx, status: item.status, priority: item.priority, content: item.content, created_at: item.created_at}
            }); break
          case 'ctrl.header':
            this.head = d.meta || {}; break
          case 'ctrl.models':
            this.models = d.models || []
            this.providerNames = d.providers || {}; break
        }
      },

      // todo helpers for the template
      statusIcon(s) {
        return s === 'completed' ? '✓' : s === 'in_progress' ? '●' : s === 'cancelled' ? '✗' : '○'
      },
      statusStyle(s) {
        var color = s === 'completed' ? '#4ade80' : s === 'in_progress' ? '#60a5fa' : s === 'cancelled' ? '#f87171' : '#9ca3af'
        return 'color:' + color
      },
      shortTime(ts) {
        if (!ts) return ''
        var d = new Date(ts); if (isNaN(d.getTime())) return ''
        var h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0')
        return h + ':' + m
      },

      // command palette
      palCommands() {
        const cur = this.head.provider && this.head.model ? this.head.provider + '/' + this.head.model : ''
        const cmds = [
          {id:'compact', group:'session', icon:'⧗', label:'Compact context', hint:'free tokens', run: () => this.post({type:'compact'})},
          {id:'stop', group:'session', icon:'■', label:'Stop agent', hint:'abort run', disabled: !this.live, run: () => this.stop()},
          {id:'reconnect', group:'session', icon:'↻', label:'Reconnect stream', hint:'SSE', run: () => this.connect()},
          {id:'copy', group:'view', icon:'⧉', label:'Copy last response', hint:'clipboard', disabled: !this.lastResponse(), run: () => this.copyLastResponse()},
          {id:'clear', group:'view', icon:'⌫', label:'Clear conversation view', hint:'local only', run: () => { this.msgs = []; this._tools = {} }},
        ]
        for (const m of this.models) {
          const i = m.indexOf('/')
          const prov = i > 0 ? m.slice(0, i) : ''
          const name = i > 0 ? m.slice(i + 1) : m
          cmds.push({id:'model:' + m, group:'models', icon:'', label:name, hint:this.providerNames[prov] || prov, current: m === cur, run: () => this.post({type:'model', provider:prov, model:name})})
        }
        return cmds
      },
      palItems() {
        const q = this.palQuery.trim().toLowerCase()
        const all = this.palCommands()
        const hit = q ? all.filter(c => (c.label + ' ' + c.hint + ' ' + c.id).toLowerCase().includes(q)) : all
        const seen = {}
        return hit.map(c => {
          const first = !seen[c.group]
          seen[c.group] = true
          return Object.assign({}, c, {first})
        })
      },
      palGroupLabel(g) { return g === 'models' ? 'switch model' : g },
      palFirstEnabled() {
        const items = this.palItems()
        for (let i = 0; i < items.length; i++) if (!items[i].disabled) return i
        return 0
      },
      palToggle() { this.palOpen ? this.palClose() : this.palShow() },
      palShow() {
        this.palOpen = true; this.palQuery = ''; this.palIdx = 0
        this.$nextTick(() => { const i = this.$refs.palInput; if (i) i.focus() })
      },
      palClose() {
        if (!this.palOpen) return
        this.palOpen = false
        if (this.$refs.el) this.$refs.el.focus()
      },
      palMove(d) {
        const items = this.palItems()
        if (!items.length) return
        let i = this.palIdx
        for (let n = 0; n < items.length; n++) {
          i = (i + d + items.length) % items.length
          if (!items[i].disabled) break
        }
        this.palIdx = i
        this.$nextTick(() => {
          const el = this.$refs.palList && this.$refs.palList.querySelector('.pal-item.active')
          if (el) el.scrollIntoView({block:'nearest'})
        })
      },
      palRun(i) {
        const it = this.palItems()[i]
        if (!it || it.disabled) return
        this.palClose()
        it.run()
      },
      palKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault()
          this.palOpen ? this.palClose() : this.palShow()
          return
        }
        if (!this.palOpen) return
        if (e.key === 'Escape') { e.preventDefault(); this.palClose() }
        else if (e.key === 'ArrowDown') { e.preventDefault(); this.palMove(1) }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.palMove(-1) }
        else if (e.key === 'Enter') { e.preventDefault(); this.palRun(this.palIdx) }
      },
      lastResponse() {
        for (let i = this.msgs.length - 1; i >= 0; i--) {
          if (this.msgs[i].role === 'asst') return this.msgs[i].raw || ''
        }
        return ''
      },
      copyLastResponse() {
        const t = this.lastResponse()
        if (!t) return
        navigator.clipboard.writeText(t).then(() => {
          const prev = this.status
          this.status = 'copied to clipboard'
          setTimeout(() => { if (this.status === 'copied to clipboard') this.status = prev }, 1500)
        })
      },

      ask() {
        const c = this.$refs.dlg.querySelectorAll('input[name="qopt"]:checked')
        const v = Array.from(c).map(c => c.value)
        this.post({type:'answer', id:this.modal.aid, value: this.modal.multi ? v.join(',') : (v[0]||'')})
        this.$refs.dlg.close()
      },
      allow(v) { this.post({type:'answer', id:this.modal.aid, value: String(v)}); this.$refs.dlg.close() },

      send() {
        const el = this.$refs.el, t = el.value.trim()
        if (!t || this.live) return
        this.add('user', t); el.value = ''; el.style.height = 'auto'
        this.live = true; this.think = ''
        this.post({type:'prompt', text: t}); this.scroll()
      },

      stop() { this.post({type:'abort'}) },
      post(body) {
        fetch('/api/action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
          .then(r => { if (r.status === 409) this.status = 'agent is busy' })
      }
    }
  })
})
</script>
</body>
</html>
