services:
  yaah:
    build: .
    image: yaah:local
    stdin_open: true
    tty: true
    volumes:
      - ~/.yaah:/root/.yaah
    environment:
      - YAAH_OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=host.docker.internal:4318
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
    profiles: [cli]
