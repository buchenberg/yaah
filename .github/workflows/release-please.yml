name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'  # sandbox/containerd v0.1.5 requires go >= 1.26.3
          cache: true

      - name: build
        shell: bash
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p dist
          out=dist/yaah-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            out="${out}.exe"
          fi
          # Stamp version/commit/date via ldflags. Without these, the binary
          # falls back to debug.ReadBuildInfo, which yields a v0.0.0-*
          # pseudo-version on this shallow checkout (no tags fetched) — and
          # `yaah update` parses that as 0.0.0 forever.
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/buchenberg/yaah/cmd/yaah.version=$TAG_NAME"
          ldflags="$ldflags -X github.com/buchenberg/yaah/cmd/yaah.commit=${GITHUB_SHA::7}"
          ldflags="$ldflags -X github.com/buchenberg/yaah/cmd/yaah.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "$ldflags" -o "$out" .

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaah-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/yaah-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  upload:
    name: upload release assets
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: generate checksums
        run: |
          cd dist
          sha256sum yaah-* > checksums.txt
          cat checksums.txt

      - name: upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} dist/yaah-* dist/checksums.txt
