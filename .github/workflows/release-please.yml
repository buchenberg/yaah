name: release-please

on:
  push:
    branches: [main]
  # Recovery path. `release_created` is only true on the run that creates the
  # release, so re-running a failed run (or any run after the release exists)
  # skips build/upload forever. Dispatching with an existing tag rebuilds and
  # re-uploads that release's assets from the tagged source.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v0.103.2'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    # Only push runs drive releases. On workflow_dispatch there is nothing to
    # release; the build job checks out the requested tag instead.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [release-please]
    # `always()` keeps this job alive when release-please is skipped (dispatch)
    # or fails. The latter matters: release-please can create the tag/release
    # and *then* die on a transient GitHub 5xx, which is exactly how v0.103.2
    # shipped with zero assets. If the outputs survived the failure, build and
    # upload still run; if they did not, dispatch this workflow with the tag.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          # The ACP registry manifest needs a key for all six platforms, so
          # windows-aarch64 must exist even though it is the least used.
          - { goos: windows, goarch: arm64 }
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Build the tagged source, not whatever is on main: a dispatch may
          # be repairing an older release, and main moves on.
          ref: ${{ inputs.tag || github.sha }}

      - name: verify release tag
        shell: bash
        run: |
          test -n "$TAG_NAME" || { echo "missing release tag (release_created=${{ needs.release-please.outputs.release_created }})"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null ||
            { echo "tag $TAG_NAME does not exist on origin"; exit 1; }

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'  # sandbox/containerd v0.1.5 requires go >= 1.26.3
          cache: true

      - name: build
        shell: bash
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          out=dist/yaah-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            out="${out}.exe"
          fi
          # Stamp version/commit/date via ldflags. Without these, the binary
          # falls back to debug.ReadBuildInfo, which stamps the main module
          # version from the nearest VCS tag — with no tags fetched on this
          # shallow checkout that is a v0.0.0-<ts>-<sha> pseudo-version, and
          # `yaah update` parses that as 0.0.0 forever. (Verified on the
          # v0.77.0 asset and reproduced locally with go1.27.)
          test -n "$TAG_NAME" || { echo "missing release tag"; exit 1; }
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/buchenberg/yaah/cmd/yaah.version=$TAG_NAME"
          # HEAD, not GITHUB_SHA: on dispatch the latter is the branch tip,
          # which may be newer than the tag being rebuilt.
          ldflags="$ldflags -X github.com/buchenberg/yaah/cmd/yaah.commit=$(git rev-parse --short=7 HEAD)"
          ldflags="$ldflags -X github.com/buchenberg/yaah/cmd/yaah.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "$ldflags" -o "$out" .

      # The registry manifest's distribution.binary map needs a per-platform
      # archive, not a bare binary: flat, canonical key, .tar.gz or .zip, with
      # yaah (or yaah.exe) at the extract root so cmd can be "./yaah". The
      # bare binary above is still uploaded — `yaah update` looks for
      # yaah-<goos>-<goarch>[.exe] and would break if this replaced it.
      - name: package registry archive
        shell: bash
        run: |
          bin=dist/yaah-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            bin="${bin}.exe"
          fi
          scripts/package-release.sh \
            --goos "${{ matrix.goos }}" \
            --goarch "${{ matrix.goarch }}" \
            --binary "$bin" \
            --version "$TAG_NAME" \
            --outdir dist

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaah-${{ matrix.goos }}-${{ matrix.goarch }}
          # Whole dist dir: the bare binary (for `yaah update`) plus the
          # registry archive and its sha256 line.
          path: dist/*
          if-no-files-found: error

  upload:
    name: upload release assets
    needs: [release-please, build]
    # Attach whatever build actually produced. Gating on release_created meant
    # a re-run could never repair a release whose first run failed mid-flight.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: generate checksums
        run: |
          cd dist
          # Covers the bare binaries and the registry archives: the archives
          # are named yaah-<tag>-<platform-key>.{tar.gz,zip}. The per-job
          # sha256sums.txt files carry the same values and would only collide
          # after merge-multiple, so drop them.
          rm -f sha256sums.txt
          sha256sum yaah-* > checksums.txt
          cat checksums.txt

      - name: verify archives resolve the manifest cmd
        run: |
          # Mirror the registry's launch probe: extract each archive and check
          # that the manifest's cmd ("./yaah", "./yaah.exe") resolves from the
          # EXTRACT ROOT. A nested tarball or a non-executable bit fails here
          # rather than in a client.
          cd dist
          fail=0
          for a in yaah-*.tar.gz; do
            [ -f "$a" ] || continue
            d=$(mktemp -d)
            tar -xzf "$a" -C "$d"
            if [ ! -x "$d/yaah" ]; then echo "FAIL $a: ./yaah missing or not executable"; fail=1; fi
            rm -rf "$d"
          done
          for a in yaah-*.zip; do
            [ -f "$a" ] || continue
            d=$(mktemp -d)
            unzip -q "$a" -d "$d"
            if [ ! -f "$d/yaah.exe" ]; then echo "FAIL $a: yaah.exe missing at root"; fail=1; fi
            rm -rf "$d"
          done
          [ "$fail" -eq 0 ] && echo "all archives resolve ./yaah from the extract root"

      - name: upload to release
        shell: bash
        run: |
          test -n "$TAG_NAME" || { echo "missing release tag"; exit 1; }
          # --clobber makes re-runs idempotent: assets from a partial or
          # previous upload are replaced, not rejected as already existing.
          gh release upload "$TAG_NAME" dist/yaah-* dist/checksums.txt --clobber

      - name: verify every built asset is attached
        shell: bash
        run: |
          # A skipped or partial upload is invisible otherwise: the workflow
          # goes green and the release page silently ships with no downloads.
          cd dist
          printf '%s\n' yaah-* checksums.txt | sort > "$RUNNER_TEMP/expected.txt"
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' |
            sort > "$RUNNER_TEMP/attached.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/attached.txt" ||
            { echo "release $TAG_NAME is missing assets (see diff above)"; exit 1; }
          echo "all $(wc -l < "$RUNNER_TEMP/expected.txt") assets attached to $TAG_NAME"
